<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JUGGS Character Builder</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="no-print">
    <h1>JUGGS Character Builder</h1>
    <p class="subtitle" id="subtitle"></p>
  </header>

  <p id="loading">Loading rules data…</p>

  <div id="app" hidden>
    <div class="char-bar no-print">
      <label class="char-pick">Character <select id="char-select"></select></label>
      <div class="char-buttons">
        <button type="button" id="char-new">New</button>
        <button type="button" id="char-copy">Duplicate</button>
        <button type="button" id="char-delete">Delete</button>
        <button type="button" id="char-export">Export</button>
        <button type="button" id="char-import">Import</button>
        <button type="button" id="char-print">Print</button>
        <input type="file" id="char-file" accept=".json,application/json" hidden>
      </div>
    </div>
    <nav class="tabs no-print" role="tablist" aria-label="Sections">
      <button type="button" role="tab" data-tab="character">Character</button>
      <button type="button" role="tab" data-tab="skills">Skills</button>
      <button type="button" role="tab" data-tab="roles">Roles &amp; Feats</button>
      <button type="button" role="tab" data-tab="advancement">Advancement</button>
      <button type="button" role="tab" data-tab="powers">Powers</button>
      <button type="button" role="tab" data-tab="sheet">Sheet</button>
    </nav>

    <main class="tab-panel" id="tab-character" role="tabpanel"></main>
    <main class="tab-panel" id="tab-skills" role="tabpanel" hidden></main>
    <main class="tab-panel" id="tab-roles" role="tabpanel" hidden></main>
    <main class="tab-panel" id="tab-advancement" role="tabpanel" hidden></main>
    <main class="tab-panel" id="tab-powers" role="tabpanel" hidden></main>
    <div class="tab-panel sheet-panel" id="tab-sheet" role="tabpanel" hidden></div>
  </div>

  <div id="roll-toast" class="roll-toast no-print" role="status" aria-live="polite" hidden></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
